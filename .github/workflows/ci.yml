name: CI

# Quality gate only. Production deploy authority is the local Vercel CLI
# (`vercel deploy --prod --yes`) run AFTER this pipeline is green — a single
# deploy source avoids CLI/CI drift. Migrating deploy into CI is deferred
# (see README: Vercel deployment).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: gauntlet/reports/evidence/
          retention-days: 7
